name: Compiler le 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les bibliothèques 3DS
        run: dkp-pacman -S --noconfirm 3ds-dev

      - name: Compiler
        run: make

      - name: Publier le fichier .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: crepuscule-3dsx
          path: |
            crepuscule.3dsx
            crepuscule.smdh
